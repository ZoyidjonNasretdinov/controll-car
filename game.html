<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Car Game</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#111; overflow:hidden; display:flex; align-items:center; justify-content:center; height:100vh; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const W = canvas.width, H = canvas.height;

// Keys
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; keys[e.key] = true; });
window.addEventListener('keyup',   e => { keys[e.code] = false; keys[e.key] = false; });
document.addEventListener('keydown', e => { keys[e.code] = true; keys[e.key] = true; });
document.addEventListener('keyup',   e => { keys[e.code] = false; keys[e.key] = false; });

// Road properties
const ROAD_W = 320;
const LANE_COUNT = 3;
let roadX = W / 2;

// Car
const car = {
  x: W / 2,
  y: H * 0.75,
  w: 44,
  h: 80,
  speed: 0,
  maxSpeed: 14,
  acc: 0.4,
  brake: 0.7,
  friction: 0.08,
  steer: 0,
};

// Road lines (dashes)
let lines = [];
for (let i = 0; i < 20; i++) lines.push({ y: i * 80 });
let lineSpeed = 0;

// Traffic cars
let traffic = [];
let trafficTimer = 0;
const COLORS = ['#e74c3c','#3498db','#f39c12','#9b59b6','#1abc9c','#e67e22'];

let score = 0;
let lives = 3;
let shake = 0;
let flash = 0;
let gameOver = false;

function spawnTraffic() {
  const lane = Math.floor(Math.random() * LANE_COUNT);
  const laneW = ROAD_W / LANE_COUNT;
  const lx = (W - ROAD_W) / 2 + laneW * lane + laneW / 2;
  traffic.push({ x: lx, y: -100, w: 40, h: 72, color: COLORS[Math.floor(Math.random()*COLORS.length)], speed: 2 + Math.random()*2 });
}

function drawRoad() {
  // Road background
  const rx = (W - ROAD_W) / 2;
  ctx.fillStyle = '#2d2d2d';
  ctx.fillRect(rx, 0, ROAD_W, H);

  // Edges
  ctx.strokeStyle = '#f1c40f';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(rx, 0); ctx.lineTo(rx, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(rx + ROAD_W, 0); ctx.lineTo(rx + ROAD_W, H); ctx.stroke();

  // Lane dashes
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 2;
  ctx.setLineDash([40, 50]);
  for (let l = 1; l < LANE_COUNT; l++) {
    const lx = rx + (ROAD_W / LANE_COUNT) * l;
    ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, H); ctx.stroke();
  }
  ctx.setLineDash([]);
}

function drawCar(x, y, w, h, color, isPlayer) {
  const r = 8;
  // Body
  ctx.save();
  ctx.shadowBlur = isPlayer ? 20 : 8;
  ctx.shadowColor = isPlayer ? '#00ffcc' : color;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x - w/2, y - h/2, w, h, r);
  ctx.fill();
  ctx.restore();

  // Windows
  ctx.fillStyle = isPlayer ? '#aef' : '#333';
  ctx.beginPath();
  ctx.roundRect(x - w/2 + 5, y - h/2 + 12, w - 10, 18, 4);
  ctx.fill();

  // Wheels
  ctx.fillStyle = '#111';
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sy]) => {
    ctx.beginPath();
    ctx.roundRect(x + sx*(w/2 - 2) - 7, y + sy*(h/2 - 14) - 8, 7, 16, 3);
    ctx.fill();
  });

  if (isPlayer) {
    // Headlights
    ctx.fillStyle = '#ffe080';
    ctx.shadowColor = '#ffe080';
    ctx.shadowBlur = 15;
    [-1,1].forEach(s => {
      ctx.beginPath();
      ctx.ellipse(x + s*(w/2 - 8), y - h/2 + 6, 5, 4, 0, 0, Math.PI*2);
      ctx.fill();
    });
  }
}

function checkCollision(a, b) {
  return Math.abs(a.x - b.x) < (a.w + b.w) / 2 - 4 &&
         Math.abs(a.y - b.y) < (a.h + b.h) / 2 - 4;
}

function update() {
  if (gameOver) return;

  const isLeft  = keys['ArrowLeft']  || keys['a'] || keys['KeyA'];
  const isRight = keys['ArrowRight'] || keys['d'] || keys['KeyD'];
  const isUp    = keys['ArrowUp']    || keys['w'] || keys['KeyW'];
  const isDown  = keys['ArrowDown']  || keys['s'] || keys['KeyS'];

  // Speed
  if (isUp)   car.speed = Math.min(car.speed + car.acc, car.maxSpeed);
  else if (isDown) car.speed = Math.max(car.speed - car.brake, -5);
  else         car.speed -= Math.sign(car.speed) * Math.min(Math.abs(car.speed), car.friction);

  // Steering
  if (isLeft)  car.steer = Math.max(car.steer - 0.5, -5);
  else if (isRight) car.steer = Math.min(car.steer + 0.5, 5);
  else car.steer *= 0.75;

  car.x += car.steer * (Math.abs(car.speed) / car.maxSpeed);

  // Road boundaries
  const rx = (W - ROAD_W) / 2;
  car.x = Math.max(rx + car.w/2, Math.min(rx + ROAD_W - car.w/2, car.x));

  // Lines scroll
  lineSpeed = car.speed * 3;
  lines.forEach(l => { l.y += lineSpeed; if (l.y > H + 80) l.y -= 20 * 80; });

  // Traffic
  trafficTimer -= 1 + car.speed * 0.1;
  if (trafficTimer <= 0) {
    spawnTraffic();
    trafficTimer = 60 + Math.random() * 60;
  }
  traffic.forEach(t => { t.y += t.speed + car.speed * 0.8; });
  traffic = traffic.filter(t => t.y < H + 150);

  // Collisions
  traffic.forEach(t => {
    if (checkCollision(car, t)) {
      lives--;
      shake = 20;
      flash = 10;
      t.y = H + 200; // remove
      if (lives <= 0) gameOver = true;
    }
  });

  if (car.speed > 0) score += car.speed * 0.01;
  if (shake > 0) shake--;
  if (flash > 0) flash--;
}

function draw() {
  const sx = shake ? (Math.random() - 0.5) * 10 : 0;
  const sy = shake ? (Math.random() - 0.5) * 6 : 0;
  ctx.save();
  ctx.translate(sx, sy);

  // Background (grass)
  ctx.fillStyle = '#1a4a1a';
  ctx.fillRect(0, 0, W, H);

  drawRoad();

  // Traffic cars
  traffic.forEach(t => drawCar(t.x, t.y, t.w, t.h, t.color, false));

  // Player
  drawCar(car.x, car.y, car.w, car.h, '#00ffcc', true);

  // Flash
  if (flash > 0) {
    ctx.fillStyle = `rgba(255,0,0,${flash * 0.05})`;
    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();

  // HUD
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(10, 10, 200, 60);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px Outfit, sans-serif';
  ctx.fillText(`SCORE: ${Math.floor(score)}`, 20, 35);
  ctx.fillText(`LIVES: ${'❤️'.repeat(lives)}`, 20, 58);

  // Speed bar
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(W - 120, 10, 110, 30);
  ctx.fillStyle = `hsl(${120 - car.speed * 8}, 100%, 50%)`;
  ctx.fillRect(W - 118, 12, Math.max(0, car.speed / car.maxSpeed) * 106, 26);
  ctx.fillStyle = '#fff';
  ctx.font = '13px Outfit, sans-serif';
  ctx.fillText(`${Math.round(car.speed * 10)} km/h`, W - 108, 30);

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff3366';
    ctx.font = 'bold 52px Outfit, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W/2, H/2 - 30);
    ctx.fillStyle = '#fff';
    ctx.font = '24px Outfit, sans-serif';
    ctx.fillText(`Score: ${Math.floor(score)}`, W/2, H/2 + 20);
    ctx.font = '18px Outfit, sans-serif';
    ctx.fillStyle = '#aaa';
    ctx.fillText('R bosing - qayta boshlash', W/2, H/2 + 60);
    ctx.textAlign = 'left';
  }
}

window.addEventListener('keydown', e => {
  if (e.code === 'KeyR' && gameOver) {
    score = 0; lives = 3; gameOver = false; traffic = [];
    car.x = W/2; car.speed = 0; car.steer = 0;
  }
});

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
